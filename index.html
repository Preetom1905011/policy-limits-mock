<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Policy Limits Mock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: same as County Policy Trade-offs: control rail on the left, answer first on the right, plot and top 5 below. */
:root {
  --bg: #f4f6f7; --panel: #ffffff; --ink: #14212b; --muted: #5b6b77; --line: #d9e0e5; --accent: #0f5f7a;
  --accent-soft: #e2eef2; --good: #2e7d4f; --warn: #a35a00; --bad: #a3322a; --region: rgba(15, 95, 122, 0.08);
  --g-open: #1f77b4; --g-fact: #ff7f0e; --g-school: #2ca02c; --g-ness: #d62728; --g-nesss: #9467bd; --g-work: #8c564b; --g-all: #e377c2;
  --lv-low: #2b8cbe; --lv-moderate: #f1c40f; --lv-substantial: #e67e22; --lv-high: #b2182b; --lv-on: #ffffff;
  --sans: "Public Sans", "Segoe UI", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f171d; --panel: #16222b; --ink: #e6edf1; --muted: #9aabb6; --line: #2a3a46; --accent: #5fb3d0;
  --accent-soft: #1b3442; --good: #6cc48f; --warn: #e5a54a; --bad: #e57c72; --region: rgba(95, 179, 208, 0.12); --lv-low: #6fb7e6; --lv-moderate: #f7dc6f; --lv-substantial: #f0a04b; --lv-high: #e8606b; --lv-on: #0f171d; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f171d; --panel: #16222b; --ink: #e6edf1; --muted: #9aabb6; --line: #2a3a46; --accent: #5fb3d0;
  --accent-soft: #1b3442; --good: #6cc48f; --warn: #e5a54a; --bad: #e57c72; --region: rgba(95, 179, 208, 0.12); --lv-low: #6fb7e6; --lv-moderate: #f7dc6f; --lv-substantial: #f0a04b; --lv-high: #e8606b; --lv-on: #0f171d; color-scheme: dark }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.45; padding-inline: 16px; padding-block: 20px 40px; }
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 20px; grid-template-columns: 300px minmax(0, 1fr); align-items: start; }
@media (max-width: 860px) { .wrap { grid-template-columns: 1fr; } }
header.top { max-width: 1240px; margin: 0 auto 16px; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; }
header.top h1 { font-size: 1.5rem; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
header.top p { margin: 0; color: var(--muted); font-size: 0.9rem; }
.mock { font-family: var(--mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--warn); border: 1px solid var(--warn); padding: 1px 6px; border-radius: 3px; }
aside, main > section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
aside { padding: 16px; display: grid; gap: 18px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
@media (max-width: 860px) { aside { position: static; } }
.lbl { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 6px; display: block; }
select { width: 100%; padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; font-size: 0.88rem; }
input:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.lens { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.lens button { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 6px; padding: 7px 4px; font: inherit; font-size: 0.8rem; cursor: pointer; }
.lens button:hover { border-color: var(--accent); }
.slider { display: grid; gap: 2px; }
.slider .row { display: flex; justify-content: space-between; font-size: 0.85rem; gap: 8px; }
.slider .val { font-family: var(--mono); font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.hint { font-size: 0.78rem; color: var(--muted); }
main { display: grid; gap: 20px; min-width: 0; }
.card { padding: 20px 22px; display: grid; gap: 14px; }
.answer { font-size: 1.25rem; line-height: 1.35; margin: 0; text-wrap: balance; }
.answer strong { color: var(--accent); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.fact { border-top: 2px solid var(--line); padding-top: 8px; font-size: 0.9rem; min-width: 0; }
.fact .k { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 600; }
.fact .v { font-family: var(--mono); font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.flags { display: flex; flex-wrap: wrap; gap: 6px; }
.flag { font-size: 0.78rem; border-radius: 999px; padding: 2px 10px; border: 1px solid var(--line); color: var(--muted); }
.flag.warn { border-color: var(--warn); color: var(--warn); }
h2 { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin: 0; }
.plotwrap { overflow-x: auto; }
svg text { fill: var(--muted); font-family: var(--mono); font-size: 10px; }
svg .axis { stroke: var(--line); }
svg .zero { stroke: var(--muted); stroke-dasharray: 3 3; }
svg .lim { stroke: var(--accent); stroke-width: 1.5; }
svg .region { fill: var(--region); }
.legend { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; font-size: 0.78rem; color: var(--muted); margin-top: 6px; }
.legend .lg { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.legend .lg > span { display: inline-flex; align-items: center; gap: 5px; }
.legend .lg-shape { flex: 1 1 260px; }
.legend .lg-color { flex: 1 1 260px; justify-content: flex-end; }
.legend .lg-note { flex-basis: 100%; }
.mk { display: inline-block; vertical-align: -1px; margin-right: 6px; overflow: visible; }
@media (max-width: 640px) { .legend .lg-color { justify-content: flex-start; } }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.86rem; min-width: 560px; }
th { text-align: left; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
th.num { text-align: right; }
td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
tr.top td { background: var(--accent-soft); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.dia { display: inline-block; width: 9px; height: 9px; border: 1.5px solid var(--ink); transform: rotate(45deg); margin-right: 6px; background: var(--panel); }
details { font-size: 0.85rem; color: var(--muted); }
summary { cursor: pointer; font-weight: 600; }
.eq { font-family: var(--mono); font-size: 0.8rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; overflow-x: auto; white-space: pre; line-height: 1.6; margin-top: 8px; }
#tip { position: fixed; pointer-events: none; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 0.8rem; box-shadow: 0 2px 8px rgba(0,0,0,.15); max-width: 260px; z-index: 5; }
.lens.four { grid-template-columns: repeat(2, 1fr); }
.lens button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--panel); font-weight: 600; }
.lens button .cnt { display: block; font-family: var(--mono); font-size: 0.7rem; font-weight: 400; opacity: 0.85; }
th button.sort { border: 0; background: none; padding: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; cursor: pointer; }
th button.sort:hover { color: var(--ink); }
th button.sort[aria-sort] { color: var(--ink); }
svg .box { fill: none; stroke: var(--ink); stroke-width: 1.5; }
#levels button { border-color: var(--lvc); background: color-mix(in srgb, var(--lvc) 12%, var(--bg)); }
#levels button[aria-pressed=true] { background: var(--lvc); border-color: var(--lvc); color: var(--lv-on); }
#levels button[data-l=moderate][aria-pressed=true] { color: #14212b; }
</style>

<header class="top">
  <h1>Policy Limits</h1>
  <span class="mock">Mock-up</span>
  <p id="sub"></p>
</header>

<div class="wrap">
  <aside aria-label="Settings">
    <div><label class="lbl" for="view">View</label>
      <select id="view">
        <option value="base">Compare with a baseline</option>
        <option value="level">Epidemic level (CDC)</option>
      </select></div>
    <div><label class="lbl" for="county">County</label><select id="county"></select></div>
    <div><span class="lbl">Period</span>
      <div class="lens" role="group" aria-label="Period" id="hz" style="grid-template-columns:repeat(4,1fr)">
        <button data-h="H1">H1</button><button data-h="H2">H2</button><button data-h="H3">H3</button><button data-h="H4">H4</button>
      </div><span class="hint" id="hznote" style="display:block;margin-top:4px"></span></div>

    <div id="cfg-base" style="display:grid;gap:18px">
      <div><label class="lbl" for="base">Compare with</label><select id="base"></select></div>
      <div class="slider">
        <div class="row"><label for="la">Extra cases, at most</label><span class="val" id="lav"></span></div>
        <input id="la" type="range">
      </div>
      <div class="slider">
        <div class="row"><label for="li">Extra income days lost, at most</label><span class="val" id="liv"></span></div>
        <input id="li" type="range">
      </div>
      <div class="slider">
        <div class="row"><label for="ls">Extra school days lost, at most</label><span class="val" id="lsv"></span></div>
        <input id="ls" type="range">
        <span class="hint">Cases per 100K per week. Below 0 means it must beat the baseline.</span>
      </div>
      <div class="lens" role="group" aria-label="Quick settings">
        <button id="p-nomore">No more cases</button>
        <button id="p-cheaper">Cheaper</button>
        <button id="p-open">No limits</button>
      </div>
    </div>

    <div id="cfg-level" hidden style="gap:8px">
      <span class="lbl">Epidemic level you accept</span>
      <div class="lens four" role="group" aria-label="CDC transmission level" id="levels"></div>
      <span class="hint">CDC community transmission levels, by reported cases per 100K per week (average over the window).</span>
    </div>
  </aside>

  <main>
    <section class="card" id="card" aria-live="polite"></section>
    <section class="card">
      <h2 id="plot-title"></h2>
      <div class="plotwrap"><svg id="plot" role="img" aria-label="Cases against income lost for each policy"></svg></div>
      <div class="legend" id="legend"></div>
    </section>
    <section class="card">
      <h2 id="tbl-title"></h2>
      <div class="tablewrap"><table id="tbl"></table></div>
      <details><summary>How this is computed</summary>
        <div class="eq" id="eq"></div>
      </details>
    </section>
  </main>
</div>
<div id="tip" hidden></div>

const st = { h: "H2", view: "base", f: "36003", b: DEFAULT, a: 0, i: 0, s: 0, lvl: "high", sort: { key: "x", dir: 1 } };
const levelOf = (a) => Object.keys(LEVELS).find((l) => a >= LEVELS[l][1] && a < LEVELS[l][2]);

// ---- rows: x = cases, y = income days, z = school days (changes in the baseline view, absolute in the level view)
function rowsBase() {
  const P = POL(), B = P[st.b], out = {};
  for (const k of Object.keys(P)) {
    const d = P[k].A.map((x, j) => x - B.A[j]);
    out[k] = { k, d, x: mean(d), y: P[k].I - B.I, z: P[k].S - B.S };
  }
  return out;
}
function rowsLevel() {
  const P = POL(), [, lo, hi] = LEVELS[st.lvl], out = {};
  for (const k of Object.keys(P)) {
    const x = mean(P[k].A);
    out[k] = { k, x, y: P[k].I, z: P[k].S, ok: x >= lo && x < hi, q: P[k].A.filter((a) => a >= lo && a < hi).length / P[k].A.length };
  }
  return out;
}
function bounds(R) {
  const v = Object.values(R), r5 = (x, up) => (up ? Math.ceil(x / 5) : Math.floor(x / 5)) * 5;
  return { a: [r5(Math.min(0, ...v.map((r) => r.x)), false), r5(Math.max(0, ...v.map((r) => r.x)), true)],
           i: [Math.floor(Math.min(0, ...v.map((r) => r.y))), Math.ceil(Math.max(0, ...v.map((r) => r.y)))],
           s: [Math.floor(Math.min(0, ...v.map((r) => r.z))), Math.ceil(Math.max(0, ...v.map((r) => r.z)))] };
}
function setSlider(id, lo, hi, val, step) { const el = $("#" + id); el.min = lo; el.max = hi; el.step = step; el.value = Math.min(hi, Math.max(lo, val)); }
function resetLimits(mode) {
  const R = rowsBase(), b = bounds(R);
  if (mode === "nomore") { st.a = 0; st.i = b.i[1]; st.s = b.s[1]; }
  else if (mode === "cheaper") { st.a = b.a[1]; st.i = 0; st.s = 0; }
  else if (mode === "open") { st.a = b.a[1]; st.i = b.i[1]; st.s = b.s[1]; }
  else { const lowCorner = Object.values(R).every((r) => r.x >= -1e-9);
    st.a = lowCorner ? Math.max(5, Math.round(0.15 * b.a[1] / 5) * 5) : 0; st.i = b.i[1]; st.s = b.s[1]; }
  setSlider("la", b.a[0], b.a[1], st.a, 1); setSlider("li", b.i[0], b.i[1], st.i, 0.5); setSlider("ls", b.s[0], b.s[1], st.s, 1);
}

function compute() {
  let R, ks;
  if (st.view === "base") {
    R = rowsBase(); ks = Object.keys(R).filter((k) => k !== st.b);
    ks.forEach((k) => { const r = R[k];
      r.ok = r.x <= st.a + 1e-9 && r.y <= st.i + 1e-9 && r.z <= st.s + 1e-9;
      r.q = r.d.filter((v) => v <= st.a + 1e-9).length / r.d.length; });
  } else { R = rowsLevel(); ks = Object.keys(R); }
  const F = ks.filter((k) => R[k].ok);
  const byA = [...F].sort((p, q) => R[p].x - R[q].x || R[p].y - R[q].y);
  const byI = [...F].sort((p, q) => R[p].y - R[q].y || R[p].z - R[q].z || R[p].x - R[q].x);
  const { key, dir } = st.sort;
  const sorted = [...F].sort((p, q) => dir * (R[p][key] - R[q][key]) || R[p].x - R[q].x || R[p].y - R[q].y);
  const list = st.view === "base" ? sorted.slice(0, 5) : sorted;
  return { R, F, list, bestA: byA[0], bestI: byI[0], n: ks.length };
}

function render() {
  const base = st.view === "base", { R, F, list, bestA, bestI } = compute(), c = D.counties[st.f];
  $("#cfg-base").hidden = !base; $("#cfg-level").hidden = base; $("#cfg-level").style.display = base ? "none" : "grid";
  $("#sub").textContent = (base ? "Policies compared with a baseline" : "Policies grouped by the CDC transmission level they lead to") + `, from simulations of ${HZ[st.h][1]}.`;
  $("#hz").querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.h === st.h)));
  $("#hznote").textContent = HZ[st.h][0];
  const P0 = POL(), flagged = P0[FACTUAL].A.every((a, j) => a === P0["1"].A[j]) && P0[FACTUAL].I === P0["1"].I;
  const f = (v, d) => base ? sg(v, d) : nf(v, d);
  const v = (k) => `${f(R[k].x)} cases · ${f(R[k].y, 1)} income d · ${f(R[k].z)} school d`;
  if (base) { $("#lav").textContent = sg(st.a); $("#liv").textContent = sg(st.i, 1) + " d"; $("#lsv").textContent = sg(st.s) + " d"; }
  else {
    const all = rowsLevel(); // counts per level for the buttons
    const cnt = (l) => Object.values(all).filter((r) => levelOf(r.x) === l).length;
    $("#levels").innerHTML = Object.entries(LEVELS).map(([l, [lab]]) => `<button data-l="${l}" style="--lvc:var(--lv-${l})" aria-pressed="${l === st.lvl}">${lab}<span class="cnt">${cnt(l)} policies</span></button>`).join("");
    $("#levels").querySelectorAll("button").forEach((b) => (b.onclick = () => { st.lvl = b.dataset.l; render(); }));
  }
  const where = base ? "Within your limits" : `At CDC ${LEVELS[st.lvl][0]}`;
  const flags = `<div class="flags">${base ? `<span class="flag">Baseline: ${name(st.b)}</span>` : `<span class="flag">CDC ${LEVELS[st.lvl][0]}: ${LEVELS[st.lvl][1]}${LEVELS[st.lvl][2] === Infinity ? "+" : "–" + LEVELS[st.lvl][2]} cases per 100K per week</span>`}
      ${flagged ? `<span class="flag warn">No closures recorded here: What happened = Everything open</span>` : ""}
      ${st.h === "H1" ? `<span class="flag warn">No vaccines yet: vaccine-order policies match their closure policy</span>` : ""}</div>`;
  $("#card").innerHTML = bestA ? `
    <p class="answer">${where}, <strong>${name(bestA)}</strong> has the fewest cases.</p>
    <div class="facts">
      <div class="fact"><div class="k">Fewest cases</div><div>${marker(bestA)}<b>${name(bestA)}</b></div><div class="hint">${v(bestA)}</div></div>
      <div class="fact"><div class="k">Cheapest</div><div>${marker(bestI)}<b>${name(bestI)}</b></div><div class="hint">${v(bestI)}</div></div>
    </div>${flags}`
    : `<p class="answer">${base ? "No policy fits these limits. Loosen one." : `No policy leads to CDC ${LEVELS[st.lvl][0]} in ${c.name}.`}</p>${flags}`;
  $("#plot-title").textContent = base ? "Change from the baseline" : "Cases and income lost";
  $("#eq").textContent = EQ[st.view];
  plot(R, new Set(list)); table(R, list);
}

function plot(R, listSet) {
  const base = st.view === "base", svg = $("#plot"), W = Math.max(520, Math.min(860, svg.parentElement.clientWidth)), H = 360, m = { l: 54, r: 14, t: 16, b: 40 };
  svg.setAttribute("width", W); svg.setAttribute("height", H); svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const v = Object.values(R), f = (t) => base ? sg(t) : nf(t);
  let x0 = Math.min(0, ...v.map((r) => r.x)), x1 = Math.max(0, ...v.map((r) => r.x));
  let y0 = Math.min(0, ...v.map((r) => r.y)), y1 = Math.max(0, ...v.map((r) => r.y));
  if (base) { x0 = Math.min(x0, st.a); x1 = Math.max(x1, st.a); y0 = Math.min(y0, st.i); y1 = Math.max(y1, st.i); }
  const px = (x1 - x0) * 0.05 || 1, py = (y1 - y0) * 0.06 || 1; x0 -= px; x1 += px; y0 -= py; y1 += py;
  const X = (x) => m.l + (W - m.l - m.r) * (x - x0) / (x1 - x0), Y = (y) => H - m.b - (H - m.t - m.b) * (y - y0) / (y1 - y0);
  const ticks = (a, b, n) => { const s = Math.pow(10, Math.floor(Math.log10((b - a) / n))), d = [1, 2, 5, 10].map((k) => k * s).find((k) => (b - a) / k <= n) || s * 10;
    const out = []; for (let t = Math.ceil(a / d) * d; t <= b; t += d) out.push(+t.toFixed(6)); return out; };
  let g = "";
  ticks(x0, x1, 7).forEach((t) => (g += `<line class="axis" x1="${X(t)}" x2="${X(t)}" y1="${m.t}" y2="${H - m.b}"/><text x="${X(t)}" y="${H - m.b + 14}" text-anchor="middle">${f(t)}</text>`));
  ticks(y0, y1, 6).forEach((t) => (g += `<line class="axis" x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${m.l - 6}" y="${Y(t) + 3}" text-anchor="end">${f(t)}</text>`));
  if (base) {
    const ry = Y(Math.min(st.i, y1)), rx = X(Math.min(st.a, x1));
    g += `<rect class="region" x="${m.l}" y="${ry}" width="${Math.max(0, rx - m.l)}" height="${Math.max(0, H - m.b - ry)}"/>`;
    g += `<line class="zero" x1="${X(0)}" x2="${X(0)}" y1="${m.t}" y2="${H - m.b}"/><line class="zero" x1="${m.l}" x2="${W - m.r}" y1="${Y(0)}" y2="${Y(0)}"/>`;
    g += `<line class="lim" x1="${X(st.a)}" x2="${X(st.a)}" y1="${m.t}" y2="${H - m.b}"/><line class="lim" x1="${m.l}" x2="${W - m.r}" y1="${Y(st.i)}" y2="${Y(st.i)}"/>`;
  } else {
    Object.keys(LEVELS).forEach((l) => { const [, lo, hi] = LEVELS[l], a = Math.max(lo, x0), b = Math.min(hi, x1);
      if (b > a) g += `<rect x="${X(a)}" y="${m.t}" width="${X(b) - X(a)}" height="${H - m.b - m.t}" fill="var(--lv-${l})" fill-opacity="${l === st.lvl ? 0.3 : 0.12}"/>`; });
    const inn = v.filter((r) => r.ok);
    if (inn.length) { const pad = 12, bx0 = X(Math.min(...inn.map((r) => r.x))) - pad, bx1 = X(Math.max(...inn.map((r) => r.x))) + pad,
      by0 = Y(Math.max(...inn.map((r) => r.y))) - pad, by1 = Y(Math.min(...inn.map((r) => r.y))) + pad;
      g += `<rect class="box" rx="6" x="${bx0}" y="${by0}" width="${bx1 - bx0}" height="${by1 - by0}"/>`; }
  }
  g += `<text x="${(m.l + W - m.r) / 2}" y="${H - 6}" text-anchor="middle">${base ? "Extra cases per 100K per week" : "Cases per 100K per week"}</text>`;
  g += `<text transform="translate(12 ${(m.t + H - m.b) / 2}) rotate(-90)" text-anchor="middle">${base ? "Extra income days lost" : "Income days lost"}</text>`;
  const order = Object.keys(R).filter((k) => !(base && k === st.b)).sort((a, b) => (!!R[a].ok - !!R[b].ok) || (listSet.has(a) - listSet.has(b)));
  for (const k of order) { const r = R[k], op = r.ok ? 1 : 0.2;
    const ring = base && listSet.has(k) ? `stroke="var(--ink)" stroke-width="1.5"` : `stroke="var(--panel)" stroke-width="1"`;
    const cx = X(r.x), cy = Y(r.y), rr = base && listSet.has(k) ? 6.5 : 5.5;
    g += shape(kind(k), cx, cy, rr, `data-k="${k}" fill="${col(k)}" ${ring} opacity="${op}"`); }
  if (base) { const bx = X(0), by = Y(0);
    g += `<path d="M${bx} ${by - 8} L${bx + 8} ${by} L${bx} ${by + 8} L${bx - 8} ${by} Z" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.5"/>`; }
  svg.innerHTML = g;
  svg.querySelectorAll("[data-k]").forEach((el) => {
    el.onmousemove = (e) => { const k = el.dataset.k, r = R[k], t = $("#tip"); t.hidden = false;
      t.innerHTML = `<b>${name(k)}</b><br><span style="font-family:var(--mono);font-size:.75rem">${f(r.x)} cases<br>${base ? sg(r.y, 1) : nf(r.y, 1)} income d · ${f(r.z)} school d</span>${r.ok ? "" : `<br><span style="color:var(--warn)">${base ? "Outside your limits" : "CDC " + LEVELS[levelOf(r.x)][0]}</span>`}`;
      t.style.left = Math.min(e.clientX + 12, innerWidth - 270) + "px"; t.style.top = e.clientY + 12 + "px"; };
    el.onmouseleave = () => ($("#tip").hidden = true); });
  const groups = [...new Set(Object.keys(R).filter((k) => k !== FACTUAL).map((k) => D.policies[k].group))];
  const kinds = [...new Set(Object.keys(R).map(kind))].filter((kd) => kd !== "fact");
  const grey = css("--muted");
  $("#legend").innerHTML =
    `<div class="lg lg-shape">` + ["vacc", "npi", "both"].filter((kd) => kinds.includes(kd)).map((kd) => `<span>${icon(kd, grey)}${KIND[kd]}</span>`).join("") +
      `<span>${icon("fact", css("--ink"))}What happened</span>` + (base ? `<span>${icon("fact", css("--panel"), css("--ink"))}Baseline</span>` : "") + `</div>` +
    `<div class="lg lg-color">` + groups.map((gk) => `<span><span class="dot" style="background:${css(GROUP[gk][1])};margin-right:0"></span>${GROUP[gk][0]}</span>`).join("") + `</div>` +
    `<div class="lg lg-note"><span>${base ? "Shaded: within limits · outlined: top 5" : "Box: policies at the selected level"}</span></div>`;
}

function table(R, list) {
  const base = st.view === "base", f = (v, d) => base ? sg(v, d) : nf(v, d);
  const cols = base ? [["x", "Extra cases"], ["y", "Extra income d"], ["z", "Extra school d"]] : [["x", "Cases"], ["y", "Income d"], ["z", "School d"]];
  const what = { x: "fewest cases", y: "least income lost", z: "fewest school days lost" }, whatD = { x: "most cases", y: "most income lost", z: "most school days lost" };
  $("#tbl-title").textContent = base ? `Top 5 within your limits, ${(st.sort.dir > 0 ? what : whatD)[st.sort.key]} first`
    : `Policies at CDC ${LEVELS[st.lvl][0]}, ${(st.sort.dir > 0 ? what : whatD)[st.sort.key]} first`;
  const th = cols.map(([k, lab]) => `<th class="num"><button class="sort" data-k="${k}" ${st.sort.key === k ? `aria-sort="${st.sort.dir > 0 ? "ascending" : "descending"}"` : ""}>${lab}${st.sort.key === k ? (st.sort.dir > 0 ? " ↑" : " ↓") : ""}</button></th>`).join("");
  $("#tbl").innerHTML = `<thead><tr><th>#</th><th>Policy</th>${th}<th class="num">${base ? "Runs within limit" : "Runs at this level"}</th></tr></thead><tbody>` +
    (list.length ? list.map((k, i) => { const r = R[k];
      return `<tr class="${i === 0 ? "top" : ""}"><td class="num">${i + 1}</td><td>${marker(k)}${name(k)}</td><td class="num">${f(r.x)}</td><td class="num">${f(r.y, 1)}</td><td class="num">${f(r.z)}</td><td class="num">${Math.round(100 * r.q)}%</td></tr>`; }).join("")
      : `<tr><td colspan="6" class="hint">${base ? "No policy fits these limits." : "No policy leads to this level."}</td></tr>`) + `</tbody>`;
  $("#tbl").querySelectorAll("button.sort").forEach((b) => (b.onclick = () => {
    const k = b.dataset.k; st.sort = { key: k, dir: st.sort.key === k ? -st.sort.dir : 1 }; render(); }));
}

function baseOptions() {
  const ks = Object.keys(POL()).filter((k) => k !== DEFAULT && k !== FACTUAL).sort((a, b) => +a - +b);
  $("#base").innerHTML = [DEFAULT, FACTUAL, ...ks].map((k) => `<option value="${k}">${name(k)}${k === DEFAULT ? " (default)" : k === FACTUAL ? " (factual)" : ""}</option>`).join("");
  $("#base").value = st.b;
}
function init() {
  $("#county").innerHTML = Object.entries(D.counties).map(([f, c]) => `<option value="${f}">${c.name}, ${c.state}</option>`).join("");
  $("#county").value = st.f; baseOptions();
  $("#view").onchange = (e) => { st.view = e.target.value; st.sort = { key: "x", dir: 1 }; render(); };
  $("#county").onchange = (e) => { st.f = e.target.value; st.b = DEFAULT; baseOptions(); resetLimits(); render(); };
  $("#hz").querySelectorAll("button").forEach((b) => (b.onclick = () => { st.h = b.dataset.h; resetLimits(); render(); }));
  $("#base").onchange = (e) => { st.b = e.target.value; resetLimits(); render(); };
  [["la", "a"], ["li", "i"], ["ls", "s"]].forEach(([id, key]) => ($("#" + id).oninput = (e) => { st[key] = +e.target.value; render(); }));
  $("#p-nomore").onclick = () => { resetLimits("nomore"); render(); };
  $("#p-cheaper").onclick = () => { resetLimits("cheaper"); render(); };
  $("#p-open").onclick = () => { resetLimits("open"); render(); };
  addEventListener("resize", render);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
  resetLimits(); render();
}
init();
</script>

</html>
